<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Al Hadaf</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Hind+Siliguri:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<section id="loginView" class="login" hidden>
  <form id="loginForm" class="login-card">
    <img src="logo-light.png" alt="Al Hadaf" class="login-logo" width="661" height="357">
    <h1>Admin login</h1>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn primary block" type="submit">Log in</button>
  </form>
</section>

<div id="appView" class="shell" hidden>
  <aside class="sidebar" id="sidebar">
    <a href="#dashboard" class="side-logo"><img src="logo-dark.png" alt="Al Hadaf" width="661" height="357"></a>
    <nav class="side-nav" id="tabs">
      <a href="#dashboard" data-tab="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>Dashboard</a>
      <a href="#orders" data-tab="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Zm3 0a3 3 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Orders<b class="nbadge" id="bOrders" hidden></b></a>
      <a href="#abandoned" data-tab="abandoned"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h-3v2h2l3.6 7.6-1.4 2.4c-.6 1.1.2 2.4 1.4 2.4h10v-2H9.6l1.1-2h7.4c.8 0 1.4-.4 1.8-1l3-5.6-1.7-1-3 5.6h-7.2L7 4Zm2 16a1.5 1.5 0 1 0 0 .1Zm9 0a1.5 1.5 0 1 0 0 .1Z"/></svg>Unfinished orders<b class="nbadge" id="bAbandoned" hidden></b></a>
      <a href="#chats" data-tab="chats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.6 1.3 4.9 3.4 6.5L4.6 21.5l3.9-2c1.1.3 2.3.5 3.5.5 5.5 0 10-3.9 10-8.7S17.5 3 12 3Z"/></svg>Chats<b class="nbadge" id="bChats" hidden></b></a>
      <a href="#customers" data-tab="customers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z"/></svg>Customers</a>
      <span class="side-sep">Catalogue</span>
      <a href="#products" data-tab="products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 12 5l4-2 5 4-3 3-2-1v12H8V9l-2 1-3-3 5-4Z"/></svg>Products</a>
      <a href="#custom" data-tab="custom"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.3V21h3.7L17.8 9.9l-3.7-3.7L3 17.3ZM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7L20.7 7Z"/></svg>Tailoring</a>
      <a href="#gallery" data-tab="gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2ZM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5Z"/></svg>Gallery</a>
      <a href="#categories" data-tab="categories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v6H4V5Zm9 0h7v6h-7V5ZM4 13h7v6H4v-6Zm9 0h7v6h-7v-6Z"/></svg>Categories</a>
      <span class="side-sep">Marketing</span>
      <a href="#banners" data-tab="banners"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v12H3V5Zm2 2v8h14V7H5Zm-2 12h18v2H3v-2Z"/></svg>Banners</a>
      <a href="#coupons" data-tab="coupons"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4a2 2 0 0 1 0 4v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 1 0-4ZM9.5 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm5 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm-6.2.7-1-1 7.4-7.4 1 1-7.4 7.4Z"/></svg>Coupons</a>
      <a href="#reviews" data-tab="reviews"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 17.3 6.2 3.7-1.6-7 5.4-4.7-7.1-.6L12 2 9.1 8.7 2 9.3l5.4 4.7-1.6 7z"/></svg>Reviews<b class="nbadge" id="bReviews" hidden></b></a>
      <span class="side-sep">Shop</span>
      <a href="#settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.3-1.6ZM13 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg>Shop info</a>
    </nav>
    <div class="side-foot">
      <a href="/" target="_blank" rel="noopener" class="btn ghost-d sm">View site</a>
      <button class="btn ghost-d sm" id="logoutBtn">Log out</button>
    </div>
  </aside>
  <div class="side-backdrop" id="sideBackdrop"></div>
  <div class="content">
    <header class="mobilebar">
      <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-controls="sidebar" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><b class="nbadge dot" id="bAny" hidden></b></button>
      <img src="logo-light.png" alt="Al Hadaf" width="661" height="357">
    </header>
    <main id="main" class="main"></main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
