<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Al Hadaf | Thobes for Jumu’ah, Eid and every day</title>
  <meta name="description" content="Saudi, Omani, Kuwaiti and Moroccan thobes, ready-made or tailored to your measurements. Cash on delivery all over Bangladesh.">
  <meta property="og:title" content="Al Hadaf | Thobes for Jumu’ah, Eid and every day">
  <meta property="og:description" content="Ready-made and made-to-measure thobes. Cash on delivery all over Bangladesh.">
  <meta property="og:image" content="/logo-light.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="announce"><p class="wrap" id="announce"></p></div>

<header class="site-header">
  <div class="wrap head-row">
    <div class="head-left">
      <button class="icon-btn menu-btn" id="menuOpen" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="lang-btn" id="langBtn"></button>
    </div>
    <a class="logo" href="/#/" aria-label="Al Hadaf home">
      <picture>
        <source srcset="/logo-dark.png" media="(prefers-color-scheme: dark)">
        <img src="/logo-light.png" alt="Al Hadaf" width="661" height="357">
      </picture>
    </a>
    <div class="head-right">
      <button class="icon-btn" id="searchOpen" aria-label="Search">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
      <a class="icon-btn hide-sm" id="accountLink" href="#/account" aria-label="Account" hidden>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.3-3.6 4.2-5.4 7.5-5.4s6.2 1.8 7.5 5.4"/></svg>
      </a>
      <a class="icon-btn" id="wishLink" href="#/wishlist" aria-label="Wishlist">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20Z"/></svg>
        <span class="cart-count" id="wishCount" hidden>0</span>
      </a>
      <button class="icon-btn" id="cartOpen" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span class="cart-count" id="cartCount" hidden>0</span>
      </button>
    </div>
  </div>
  <nav class="cat-nav" id="catNav" aria-label="Categories"></nav>
</header>

<main id="view"></main>

<footer class="site-footer" id="footer"></footer>

<button class="chat-fab" id="chatFab" aria-label="Chat" aria-expanded="false" aria-controls="chatPanel">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.6 1.3 4.9 3.4 6.5L4.6 21.5l3.9-2c1.1.3 2.3.5 3.5.5 5.5 0 10-3.9 10-8.7S17.5 3 12 3Zm-4.5 9.9a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/></svg>
  <span class="chat-dot" id="chatDot" hidden></span>
</button>
<section class="chat-panel" id="chatPanel" role="dialog" aria-label="Chat" hidden></section>

<dialog id="menuDialog" class="side side-left"><div id="menuBody"></div></dialog>
<dialog id="cartDialog" class="side side-right"><div id="cartBody" class="side-inner"></div></dialog>
<dialog id="checkoutDialog" class="checkout-dialog"><div id="checkoutBody"></div></dialog>
<dialog id="lightbox" class="lightbox"><div id="lbBody"></div></dialog>
<dialog id="searchDialog" class="search-dialog"><div class="search-inner">
  <div class="search-bar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="searchInput" type="search" autocomplete="off" aria-label="Search"><button class="icon-btn" data-close aria-label="Close">×</button></div>
  <div id="searchResults" class="search-results"></div>
</div></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/lang.js"></script>
<script src="/app.js"></script>
</body>
</html>
